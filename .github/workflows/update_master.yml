name: Daily Stock Update

# Two sources, matched to how fast each field moves. Alpha Vantage supplies
# fundamentals within its 25-calls-per-day budget, while Yahoo refreshes prices
# and market caps for the whole universe every run.
#
# Anything the sheet displays for all 11,000 listings has to come from Yahoo:
# at 25 calls a day, Alpha Vantage would need over a year for one pass.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "API calls to spend on this run"
        type: number
        default: 25
      refresh_after_days:
        description: "Refresh cached fundamentals older than this many days"
        type: number
        default: 180

concurrency:
  group: commit-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MAX_CALLS: ${{ inputs.max_calls || 25 }}
      REFRESH_AFTER_DAYS: ${{ inputs.refresh_after_days || 180 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and refresh fundamentals
        run: python -u cache.py

      # Yahoo has no practical daily budget, so this covers every symbol and is
      # what actually keeps the dataset current.
      - name: Refresh prices and market caps
        run: python -u update_quotes.py

      - name: Rebuild master CSV
        run: python generate_master.py

      # The full listing directory the Google Sheet downloads. Assembled here
      # rather than in Apps Script because it needs api.nasdaq.com, which
      # stalls for requests from Google's servers and has no timeout there --
      # the sheet's own build used to die at the six-minute script limit.
      #
      # This also runs its own Yahoo pass over all ~11,000 listings, which is
      # what fills P/E and the 150-day average. The step above only quotes the
      # ~900 symbols in the Alpha Vantage cache, and those two columns were
      # stuck at 0% and 7% coverage while they depended on it. Budget ~10
      # minutes: the averages need a year of history per symbol.
      - name: Publish the sheet universe
        timeout-minutes: 30
        run: python -u build_universe.py

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_av.json master_stocks.csv universe.csv market_data.json
          # Rows carry their own fetch time, so an unchanged dataset yields an
          # unchanged file and no empty commit is created.
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh stock overviews"
          git pull --rebase --autostash
          git push
