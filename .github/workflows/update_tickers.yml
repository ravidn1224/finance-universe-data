name: Weekly Ticker Refresh

# Rebuilds the universe from the official NASDAQ Trader listings, ranked by
# average daily dollar volume. Listings change slowly, so weekly is plenty --
# and this still costs more Yahoo requests than the daily price refresh, so
# running it more often would risk the rate limiter for no benefit.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many symbols to keep"
        type: number
        default: 1000
      dry_run:
        description: "Report the result without writing"
        type: boolean
        default: false

concurrency:
  group: commit-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A shortlisted run takes about a minute; this leaves room for the fallback
    # full sweep without letting a wedged job burn an hour of runner time.
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild ticker universe
        run: |
          python -u update_tickers.py \
            --limit "${{ inputs.limit || 1000 }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # The master CSV has one row per ticker, so it has to follow the list.
      - name: Rebuild master CSV
        if: ${{ !inputs.dry_run }}
        run: python generate_master.py

      - name: Commit & push updated universe
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clean_tickers.txt master_stocks.csv
          if git diff --cached --quiet; then
            echo "Universe unchanged"
            exit 0
          fi
          git commit -m "chore(data): refresh ticker universe"
          git pull --rebase --autostash
          git push
